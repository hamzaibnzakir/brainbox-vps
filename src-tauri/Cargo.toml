[package]
name = "brainbox-vps"
version = "0.1.0"
description = "Brainbox VPS — a unified VPS management workstation"
edition = "2021"
license = "MIT"
default-run = "brainbox-vps"

[workspace]
members = ["core"]
resolver = "2"

[lib]
name = "brainbox_vps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "brainbox-vps"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
brainbox-core = { path = "core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
log = "0.4"
simplelog = "0.12"
dirs = "6"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
